# Publications, newest first. Rendered on the home page and on /publications/.
#
# To add a paper, copy an entry and edit it. Only `title`, `authors` and `venue`
# are required. `authors` accepts Markdown (use **bold** for yourself).
#   badge       short label shown as a pill, e.g. "PASC 2024"
#   status      optional second pill, e.g. "Under review"
#   image       thumbnail shown next to the entry (put files in /images/pubs/)
#   image_full  optional full-size figure opened when the thumbnail is clicked
#   links       list of {label, url}

